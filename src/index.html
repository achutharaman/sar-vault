<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sar-vault</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
    Content-Security-Policy — see docs/living-spec.md D-009 and SECURITY.md.

    Declared here rather than only at the host so that `ng serve` and production
    enforce the same policy; a CSP violation should surface while developing, not
    at deploy time. `frame-ancestors`, HSTS and `Referrer-Policy` are ignored in
    meta form and are set as real headers by the host.

    'wasm-unsafe-eval' is required: Argon2id ships as WebAssembly (Q-009) and
    WebAssembly.instantiate is blocked without it.

    style-src allows 'unsafe-inline' because Angular injects component styles as
    inline <style> elements at runtime. The framework remedy, ngCspNonce, needs a
    per-request nonce and therefore a server, which D-003 rules out. Script
    injection stays strictly controlled; this is a documented concession, not an
    oversight.

    connect-src is 'self' only until storage providers land in v0.2, at which
    point the specific provider origins get added — and nothing else, per the
    "no third-party runtime calls" rule.
  -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'none';
    script-src 'self' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self';
    manifest-src 'self';
    worker-src 'self';
    base-uri 'none';
    form-action 'none';
    object-src 'none';
    frame-src 'none'"
    />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
