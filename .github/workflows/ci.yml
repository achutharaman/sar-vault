name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Everything below is skipped until the Angular workspace is scaffolded,
      # so CI stays green on the initial scaffold commit.
      - name: Check for package.json
        id: pkg
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet — skipping build steps."
          fi

      - uses: actions/setup-node@v7
        if: steps.pkg.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.pkg.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.pkg.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Unit tests
        if: steps.pkg.outputs.exists == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.pkg.outputs.exists == 'true'
        run: npm run build --if-present

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: pkg
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.pkg.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc

      - name: npm audit
        if: steps.pkg.outputs.exists == 'true'
        run: npm audit --audit-level=moderate
