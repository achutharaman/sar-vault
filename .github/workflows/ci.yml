name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA, not by tag. A tag is mutable: whoever controls
# the action repository can repoint `v7` at different code, which then runs with
# this repository's context. That is the same trust-the-delivery-channel problem
# SECURITY.md describes for the hosted app, so it gets the same treatment here.
# Dependabot updates SHA pins and keeps the trailing version comment current.

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Unit tests run in real Chromium (living-spec D-008) so that known-answer
      # vectors are certified against genuine WebCrypto and WebAssembly rather
      # than jsdom shims. `--with-deps` installs the NSS/ALSA libraries the
      # browser needs.
      - name: Install Chromium for unit tests
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Asserts that kdbxweb's Node-only fallbacks stayed out of the bundle
      # (living-spec D-007). Without this the guarantee is only a comment.
      - name: Verify bundle
        run: npm run verify:bundle

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: npm audit
        run: npm audit --audit-level=moderate
